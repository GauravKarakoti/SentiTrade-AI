name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the bot's run analysis endpoint
        run: curl -X POST -s --max-time 30 "https://sentitrade-ai.onrender.com/run-analysis" > /dev/null || true
      - name: Ping the vault's health endpoint
        run: curl -s --max-time 30 "https://sentitrade-ai-1.onrender.com/" > /dev/null || true