<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentiTrade | Agentic Execution</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(0, 242, 254, 0.15); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .ai-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-left: 4px solid #4facfe; }
        .btn-primary { background: linear-gradient(135deg, #00f2fe, #4facfe); transition: all 0.3s ease; color: #0f172a; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .btn-primary:hover { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.98); }
        .loader { border: 3px solid rgba(15, 23, 42, 0.3); border-top: 3px solid #0f172a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Chart Container Styling */
        #tvchart { width: 100%; height: 180px; border-radius: 8px; overflow: hidden; margin-top: 1rem; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-10">

    <div class="mt-4 mb-6 text-center fade-in" style="animation-delay: 0.1s;">
        <h1 class="text-2xl font-extrabold tracking-tight">Senti<span class="gradient-text">Trade</span> AI</h1>
        <p class="text-slate-400 text-xs mt-1 font-mono uppercase tracking-widest">SoDEX Agentic Execution</p>
    </div>

    <div class="glass-panel w-full max-w-md rounded-2xl p-5 relative overflow-hidden fade-in" style="animation-delay: 0.2s;">
        
        <div id="statusBadge" class="absolute top-4 right-4 bg-yellow-500/10 text-yellow-500 text-[10px] uppercase tracking-wider px-2 py-1 rounded border border-yellow-500/20">
            Pending Action
        </div>

        <div class="mt-2 space-y-5">
            <div>
                <p class="text-slate-400 text-xs uppercase tracking-wider mb-1" id="actionLabel">Intent</p>
                <div class="flex items-baseline space-x-2">
                    <span class="text-3xl font-bold text-white" id="amountDisplay">Authorize</span>
                    <span class="text-lg text-slate-300 font-medium" id="tokenDisplay">Trade</span>
                </div>
            </div>

            <div id="tvchart" class="bg-slate-900 hidden"></div>

            <div id="aiIntelligenceCard" class="ai-card rounded-lg p-3 hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-300 font-semibold flex items-center gap-1">
                        🤖 AI Signal Strength
                    </span>
                    <span id="confidenceValue" class="text-xs font-bold text-cyan-400">80%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 mb-3">
                    <div id="confidenceBar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-1.5 rounded-full" style="width: 80%"></div>
                </div>
                <p id="rationaleText" class="text-[11px] text-slate-400 leading-relaxed italic">
                    "AI Analysis rationale will appear here."
                </p>
            </div>

            <div class="h-px bg-slate-800 w-full"></div>

            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500">Target Protocol</span>
                    <span class="text-slate-300 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> SoDEX Spot</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500">Network</span>
                    <span class="text-slate-300">ValueChain</span>
                </div>
                <div class="flex justify-between items-center text-xs" id="networkFeeRow">
                    <span class="text-slate-500">Est. Network Fee</span>
                    <span class="text-emerald-400">Gasless (Off-chain Sign)</span>
                </div>
            </div>
        </div>

        <div class="mt-6 space-y-3">
            <button id="btnAction" class="btn-primary w-full py-3.5 rounded-xl font-bold text-sm flex justify-center items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
                <span>Connect Wallet</span>
            </button>
            
            <button id="btnDisconnect" class="w-full py-2 text-slate-500 text-xs hover:text-slate-300 transition hidden">
                Disconnect
            </button>
        </div>

        <p id="statusText" class="mt-3 text-center text-xs text-slate-400 h-4"></p>
    </div>

    <script type="module">
        import { createWeb3Modal, defaultConfig } from 'https://esm.sh/@web3modal/ethers@5.1.11';
        import { BrowserProvider } from 'https://esm.sh/ethers@6.13.1';

        const projectId = 'cfd6d68649717d2118148c25c6fb5aec'; // Keep your original project ID
        const metadata = { name: 'SentiTrade', description: 'DeFi Signer', url: window.location.origin, icons: [] };
        
        const chains = [
            { chainId: 286623, name: 'SoDEX Mainnet', currency: 'SOSO', explorerUrl: 'https://main-scan.valuechain.xyz', rpcUrl: 'https://mainnet.valuechain.xyz' },
            { chainId: 138565, name: 'SoDEX Testnet', currency: 'SOSO', explorerUrl: 'https://test-scan.valuechain.xyz', rpcUrl: 'https://testnet.valuechain.xyz' }
        ];

        const modal = createWeb3Modal({ ethersConfig: defaultConfig({ metadata }), chains, projectId });
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const txParams = {
            intent: urlParams.get('intent') || 'connect',
            hash: urlParams.get('hash'),
            nonce: urlParams.get('nonce'),
            payload: urlParams.get('payload'),
            address: urlParams.get('address'),
            asset: urlParams.get('asset') || 'Unknown',
            action: urlParams.get('action') || 'BUY',
            confidence: urlParams.get('confidence') || '0',
            sodexChainId: parseInt(urlParams.get('sodexChainId') || '286623', 10) 
        };

        // UI Element Selectors
        const elActionLabel = document.getElementById('actionLabel');
        const elAmountDisplay = document.getElementById('amountDisplay');
        const elTokenDisplay = document.getElementById('tokenDisplay');
        const btnAction = document.getElementById('btnAction');
        const aiCard = document.getElementById('aiIntelligenceCard');

        // Setup AI Explainability Card if data exists
        if (txParams.asset !== 'Unknown') {
            aiCard.style.display = 'block';
            document.getElementById('tvchart').style.display = 'block';
            document.getElementById('confidenceValue').innerText = `${txParams.confidence}%`;
            document.getElementById('confidenceBar').style.width = `${txParams.confidence}%`;
            document.getElementById('rationaleText').innerText = `Executing ${txParams.action} order for ${txParams.asset} based on real-time narrative strength.`;
            
            // Set action colors
            if(txParams.action.toUpperCase() === 'SELL') {
                document.getElementById('confidenceBar').classList.replace('from-cyan-500', 'from-red-500');
                document.getElementById('confidenceBar').classList.replace('to-blue-500', 'to-orange-500');
                document.getElementById('confidenceValue').classList.replace('text-cyan-400', 'text-red-400');
            }

            // Initialize Lightweight Chart (Simulating Real-Time Visuals)
            initChart();
        }

        function initChart() {
            const chartOptions = { 
                layout: { textColor: '#94a3b8', background: { type: 'solid', color: 'transparent' } },
                grid: { vertLines: { color: 'rgba(255,255,255,0.02)' }, horzLines: { color: 'rgba(255,255,255,0.02)' } },
                timeScale: { visible: false },
                rightPriceScale: { borderVisible: false }
            };
            const chart = LightweightCharts.createChart(document.getElementById('tvchart'), chartOptions);
            const lineSeries = chart.addLineSeries({ color: txParams.action.toUpperCase() === 'SELL' ? '#ef4444' : '#0ea5e9', lineWidth: 2 });
            
            // Simulate recent price action data to give the UI a "live" feel while connecting
            const mockData = Array.from({length: 30}, (_, i) => ({
                time: `2024-01-${(i+1).toString().padStart(2, '0')}`,
                value: 100 + Math.random() * 20 + (txParams.action === 'BUY' ? i : -i) // Trend based on signal
            }));
            lineSeries.setData(mockData);
            chart.timeScale().fitContent();
        }

        // Contextual UI adjustments
        if (txParams.intent === 'sign_sodex') {
             elActionLabel.innerText = "Authorize Execution";
             elAmountDisplay.innerText = txParams.action;
             elTokenDisplay.innerText = txParams.asset;
             btnAction.innerText = "Sign & Execute";
        } else if (txParams.intent === 'connect') {
             elActionLabel.innerText = "Target Asset";
             elAmountDisplay.innerText = "Connect";
             elTokenDisplay.innerText = txParams.asset;
        }

        let walletProvider = null;

        modal.subscribeProvider(async ({ provider, address }) => {
            if (provider && address) {
                walletProvider = provider;
                
                if (txParams.intent === 'connect') {
                    document.getElementById('statusBadge').innerText = "Connected";
                    btnAction.innerText = "Returning to Chat...";
                    
                    // Update the payload to send action and confidence back to main.py
                    tg.sendData(JSON.stringify({ 
                        status: 'connected', 
                        address: address,
                        asset: txParams.asset,
                        action: txParams.action,
                        confidence: txParams.confidence
                    }));
                    
                    setTimeout(() => tg.close(), 1000);
                    return; 
                }

                btnAction.disabled = false;
                btnAction.innerHTML = `Confirm Execution <span class="ml-1">✍️</span>`;
                btnAction.classList.remove('btn-primary');
                btnAction.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'text-slate-900');
                document.getElementById('btnDisconnect').style.display = "block";
                document.getElementById('statusBadge').innerText = "Wallet Linked";
                document.getElementById('statusBadge').className = "absolute top-4 right-4 bg-emerald-500/10 text-emerald-400 text-[10px] uppercase tracking-wider px-2 py-1 rounded border border-emerald-500/20";
            }
        });

        btnAction.onclick = async () => {
            if (!walletProvider) {
                await modal.open();
            } else if (txParams.intent === 'sign_sodex') {
                await signSodexOrder();
            }
        };

        async function signSodexOrder() {
            if (!walletProvider) return;
            btnAction.disabled = true;
            btnAction.innerHTML = `<div class="loader"></div>`;
            document.getElementById('statusText').innerText = "Awaiting signature in wallet...";

            try {
                const ethersProvider = new BrowserProvider(walletProvider);
                const signer = await ethersProvider.getSigner();
                
                const domain = { name: "spot", version: "1", chainId: txParams.sodexChainId };
                const types = { ExchangeAction: [ { name: 'payloadHash', type: "bytes32" }, { name: 'nonce', type: 'uint64' } ] };
                const message = { payloadHash: txParams.hash, nonce: parseInt(txParams.nonce, 10) };

                const signature = await signer.signTypedData(domain, types, message);

                document.getElementById('statusText').innerText = "Payload Signed!";
                btnAction.innerText = "Executing...";
                
                tg.sendData(JSON.stringify({ 
                    status: 'sodex_signed', 
                    signature: signature,
                    payload: txParams.payload,
                    nonce: txParams.nonce,
                    address: txParams.address
                }));
                
                setTimeout(() => tg.close(), 1500);
            } catch (error) {
                btnAction.disabled = false;
                btnAction.innerText = "Retry Sign";
                document.getElementById('statusText').innerText = "User rejected signature.";
                document.getElementById('statusText').classList.add('text-red-400');
            }
        }

        document.getElementById('btnDisconnect').onclick = () => modal.open({ view: 'Account' });
    </script>
</body>
</html>
